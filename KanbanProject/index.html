<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban board</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div class="main">
        <nav class="navbar">
            <h3>Kanban</h3>
            <button class="btn add">
                Add new Task
            </button>
        </nav>
        <div class="columns">
            <div class="mains TODO" draggable="false">
                <div class="head">
                    <h3>To Do</h3>
                    <div>Timer</div>
                </div>
                <div class="colum">
                    
                    <div class="tasks " draggable="true">
                        <h3>Data</h3>
                        <div class="content desc">
                            Hellow world
                        </div>
                        <button class="delete-btn">Delete</button>
                    </div>
                    </div>
                </div>
                <div class="mains PROGRESS">
                    <div class="head">
                    <h3>In process</h3>
                    <div>Timer</div>
                </div>
            </div>
            <div class="mains COMPLETED">
                <div class="head">
                    <h3>Completed</h3>
                    <div>Timer</div>
                </div>
            </div>
            <div class="modal add-new-task">
                <div class="bg"></div>
                
                <div class="center">
                    <input type="text" placeholder="Task Title" />
                    <textarea placeholder="Task Decription"></textarea>
                    <button class="add-new-task add-task-btn">Add new task button</button>
                </div>
            </div>
            <script src="./script.js"></script>
        </body>

</html>
